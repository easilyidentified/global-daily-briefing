name: Send Briefing Email

# 매일 08:00 KST에 data/issues.json을 읽어 KR 브리핑 이메일을 Gmail SMTP로 발송한다.
# 수집 워크플로(daily-briefing.yml, 06:40 KST)가 끝난 뒤 실행되도록 시각을 벌려 둔다.
on:
  workflow_dispatch:        # 수동 실행(먼저 버튼으로 테스트)
    inputs:
      force:
        description: "신선도 검사를 건너뛰고 지금 있는 데이터로 발송 (테스트용)"
        type: boolean
        default: false
  schedule:
    - cron: "0 23 * * *"    # UTC 23:00 = KST 익일 08:00
    # 재시도. 06:40 수집이 실패한 날은 08:00 발송이 신선도 검사에 걸려 건너뛰어진다.
    # 09:40 재수집이 성공했으면 이 실행이 그날치를 내보낸다.
    # 이미 보낸 날은 data/sent.json 멱등 가드가 막으므로 같은 메일이 두 번 나가지 않는다.
    - cron: "30 1 * * *"    # UTC 01:30 = KST 10:30

permissions:
  contents: write        # 발송 뒤 data/sent.json(멱등 기록)을 커밋한다

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute today's KST date (freshness guard)
        id: kst
        run: echo "date=$(TZ=Asia/Seoul date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      - name: Render and send briefing
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEFING_TO:        ${{ vars.BRIEFING_TO }}
          # To 헤더에 노출할 주소. 비워 두면 BRIEFING_TO의 맨 앞 하나만 보이고 나머지는 숨은참조.
          BRIEFING_TO_VISIBLE: ${{ vars.BRIEFING_TO_VISIBLE }}
          BRIEFING_FROM_NAME: ${{ vars.BRIEFING_FROM_NAME }}
          BRIEFING_COUNTRY:   KR
          EXPECT_DATE:        ${{ steps.kst.outputs.date }}
          # 수동 실행에서만 켤 수 있는 테스트 스위치. 스케줄 실행에는 inputs가 없어
          # 빈 값이 들어가므로 오발송 방지 검사는 그대로 살아 있다.
          # (GitHub 표현식으로 EXPECT_DATE를 비우려 하면 안 된다 —
          #  `cond && '' || x`는 빈 문자열이 falsy라 항상 x로 떨어진다.)
          FORCE_SEND:         ${{ inputs.force }}
        run: python3 scripts/send_briefing.py

      # 발송에 성공하면 스크립트가 data/sent.json에 날짜를 남긴다. 그 기록을 리포에 되돌려
      # 커밋해야 다음 실행이 중복 발송을 막을 수 있다. 발송이 건너뛰어졌으면 파일이
      # 그대로라 커밋할 것이 없다.
      - name: Commit send marker
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/sent.json; then
            echo "발송 기록 변경 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/sent.json
          git commit -m "발송 기록 $(TZ=Asia/Seoul date +%Y.%m.%d)"
          # 06:40 수집 커밋과 80분 차이라 충돌 가능성은 낮지만, 밀렸으면 얹어서 올린다.
          git pull --rebase --autostash origin main
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
