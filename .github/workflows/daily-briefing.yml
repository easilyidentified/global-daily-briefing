name: Daily Briefing

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "40 21 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect and summarise today's briefing
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: scripts/collect-prompt.md
          allowed_tools: "Read,Write,Edit,WebSearch,WebFetch"

      - name: Commit result
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/issues.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y.%m.%d)"
            git push
          fi
