name: Daily Briefing

on:
  workflow_dispatch:
    inputs:
      force:
        description: "오늘치가 이미 있어도 다시 수집"
        type: boolean
        default: false
  schedule:
    - cron: "40 21 * * *"   # UTC 21:40 = KST 06:40 (다음 날)
    # 재시도. 06:40 실행이 구독 5시간 한도(429)에 걸리면 1턴 만에 죽고 그날이 통째로 날아간다
    # (2026-08-20: "You've hit your session limit · resets 8:40am" — 수집도 메일도 없었다).
    # 아래 'Check whether today's data is already collected' 스텝이 오늘치가 이미 있으면
    # 수집 스텝을 건너뛰므로, 정상적인 날에 이 실행은 쿼터를 쓰지 않는다.
    - cron: "40 0 * * *"    # UTC 00:40 = KST 09:40

permissions:
  contents: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # 실측: 2026-08-10 수동 24분 / 2026-08-11 위임 차단 후 31분 47초.
    # 위임 없이 4개국을 직접 처리하면 더 오래 걸린다. 45분은 여유가 13분뿐이라 60분으로 올린다.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # 러너는 UTC로 돈다. 이 워크플로가 뜨는 21:40 UTC는 KST로 이미 '다음 날'이다.
      # 에이전트에게는 Bash가 없어 스스로 날짜를 확인할 수단이 없으므로,
      # KST 날짜를 여기서 계산해 프롬프트에 박아 넣는다. (send-briefing.yml과 같은 방식)
      - name: Compute today's KST date
        id: kst
        run: echo "date=$(TZ=Asia/Seoul date +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

      # 재시도 실행(09:40)이 이미 끝난 일을 다시 하지 않도록 여기서 끊는다.
      # 4개국 모두 오늘 날짜면 수집할 것이 없다.
      - name: Check whether today's data is already collected
        id: need
        run: |
          missing=$(python3 -c "import json;d=json.load(open('data/issues.json',encoding='utf-8'));print(','.join(c for c,v in d['COUNTRIES'].items() if v.get('latestDate')!='${{ steps.kst.outputs.date }}'))")
          echo "미수집 국가: ${missing:-없음}"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Collect and summarise today's briefing
        if: inputs.force == true || steps.need.outputs.missing != ''
        env:
          TZ: Asia/Seoul
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            오늘 날짜는 KST 기준 ${{ steps.kst.outputs.date }} 이다.
            지시서에서 '오늘 날짜'라고 하는 것은 전부 이 값을 뜻한다.
            네가 아는 날짜나 실행 환경의 시계(UTC)로 추정하지 마라 — 하루가 어긋난다.

            이 실행은 단 한 번의 세션으로 끝난다. 네가 응답을 마치는 순간 러너가 파기된다.
            - 하위 에이전트(Agent/Task)에게 위임하지 마라. 백그라운드 결과는 회수되지 않는다.
            - ScheduleWakeup 등으로 다음 턴을 기다리지 마라. 다음 턴은 오지 않는다.
            - 4개국 전부를 이 세션 안에서 네가 직접 처리하고,
              data/issues.json에 실제로 써 넣은 것을 확인한 뒤에 응답을 끝내라.
              파일을 쓰지 않고 끝내면 그 실행은 통째로 무효다.

            저장소 루트의 scripts/collect-prompt.md 파일을 먼저 읽고,
            거기에 적힌 지시를 그대로 따라 data/issues.json을 갱신하라.
            그 파일 외의 다른 파일은 수정하지 마라.
          # allowedTools만으로는 Agent/Task 계열이 막히지 않는다(2026-08-11 실행에서 실제로 호출됐다).
          # 위임과 대기 도구를 명시적으로 차단한다.
          claude_args: >-
            --allowedTools "Read,Write,Edit,WebSearch,WebFetch"
            --disallowedTools "Agent,Task,TaskCreate,TaskUpdate,TaskOutput,ScheduleWakeup,Monitor"

      # 턴 단위 실행 기록(어떤 검색을 했고 무엇을 골랐는지)은 이 파일에만 남는다.
      # 올려두지 않으면 러너와 함께 사라져서 나중에 원인 추적이 불가능하다.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/issues.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y.%m.%d)"
            # claude-code-action이 자신의 앱 토큰을 git 자격증명에 심고 스텝 종료 시 폐기한다.
            # 그대로 push하면 폐기된 토큰을 써서 401이 난다. 워크플로 GITHUB_TOKEN으로 다시 밀어준다.
            git config --local --unset-all http.https://github.com/.extraheader || true
            # 수집은 20~40분 걸린다. 그 사이 누가 main에 올리면 push가 non-fast-forward로
            # 거부되고, 러너와 함께 그날 수집분이 통째로 사라진다 (2026-08-20에 실제로 겪었다).
            # send-briefing.yml과 같은 방식으로 밀린 것을 얹어서 올린다.
            git pull --rebase --autostash origin main
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
