name: Daily Briefing

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "40 21 * * *"

permissions:
  contents: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect and summarise today's briefing
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            저장소 루트의 scripts/collect-prompt.md 파일을 먼저 읽고,
            거기에 적힌 지시를 그대로 따라 data/issues.json을 갱신하라.
            그 파일 외의 다른 파일은 수정하지 마라.
          claude_args: '--allowedTools "Read,Write,Edit,WebSearch,WebFetch"'

      - name: Commit result
        run: |
          git config user.name "briefing-bot"
          git config user.email "briefing-bot@users.noreply.github.com"
          git add data/issues.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋하지 않습니다."
          else
            git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y.%m.%d)"
            git push
          fi
